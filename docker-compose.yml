version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeforge_user
      POSTGRES_PASSWORD: tradeforge_password
      POSTGRES_DB: tradeforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeforge_user -d tradeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tradeforge-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeforge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://tradeforge_user:tradeforge_password@postgres:5432/tradeforge
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: tradeforge-super-secret-jwt-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
